<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제3차 부산광역시 아동친화도시 기본계획 전문가조사</title>
<style>
  :root{
    --bg:#f4f7f6; --card:#ffffff; --ink:#1f2a26; --muted:#6b7a74;
    --green:#1b5e20; --green-2:#2e7d32; --green-soft:#e6efe7; --line:#d9e2de;
    --sel:#1b5e20; --sel-bg:#eef6ef; --warn:#c62828; --legacy-bg:#eef4f0;
    --group-line:#1b5e20; --r1:#1b5e20; --r2:#66a06b; --amber:#fff8e1; --amber-b:#ffe082;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:'Malgun Gothic','맑은 고딕',sans-serif; background:var(--bg);
       color:var(--ink); margin:0; padding:0 0 120px; line-height:1.7; font-size:17px;}
  header{background:var(--green); color:#fff; padding:24px 40px;}
  header h1{margin:0; font-size:23px; font-weight:700; line-height:1.4;}
  header p{margin:6px 0 0; font-size:15px; opacity:.85;}
  .wrap{max-width:1520px; margin:0 auto; padding:0 40px;}

  /* 진행바 (상단 고정) */
  .progressbar{position:sticky; top:0; z-index:50; background:#fff; border-bottom:1px solid var(--line);
               padding:10px 32px; box-shadow:0 2px 6px rgba(0,0,0,.04);}
  .progressbar .inner{max-width:1400px; margin:0 auto; display:flex; align-items:center; gap:16px;}
  .bar{flex:1; height:8px; background:#e5ece8; border-radius:20px; overflow:hidden;}
  .bar span{display:block; height:100%; width:0; background:var(--green); transition:width .3s;}
  .pct{font-size:12.5px; color:var(--green); font-weight:700; white-space:nowrap;}
  .savestate{font-size:12px; color:var(--muted); white-space:nowrap; min-width:90px; text-align:right;}

  .intro{background:#fff; border:1px solid var(--line); border-radius:12px; padding:24px 28px; margin:22px 0;
         font-size:13.5px; color:#333; white-space:pre-line;}
  .pcnote{background:var(--amber); border:1px solid var(--amber-b); color:#7a5b00;
          font-size:13px; padding:9px 16px; border-radius:6px; margin:18px 0;}

  .section{margin:34px 0 8px;}
  .section h2{font-size:20px; color:var(--green); border-bottom:2px solid var(--green);
              padding-bottom:9px; margin:0 0 4px;}
  .section .sintro{font-size:15px; color:var(--muted); margin:8px 0 0; white-space:pre-line;}

  .qcard{background:var(--card); border:1px solid var(--line); border-radius:12px;
         padding:24px 28px; margin:16px 0; box-shadow:0 1px 3px rgba(0,0,0,.03); scroll-margin-top:70px;}
  .qcard.missing{border-color:#e0a3a3; box-shadow:0 0 0 2px #f6e2e2;}
  .qcode{font-weight:700; font-size:14.5px; color:var(--green); margin-bottom:5px;}
  .qtitle{font-size:18px; font-weight:600; margin:0 0 9px; line-height:1.55;}
  .req{color:var(--warn); margin-left:4px;}
  .qnote{font-size:15px; color:var(--muted); background:#f7faf8; border-left:3px solid var(--green-soft);
         padding:11px 16px; margin:8px 0 14px; border-radius:4px; white-space:pre-line;}
  .hint{font-size:15px; color:var(--muted); margin:4px 0 12px;}

  /* single / multi 선택지 */
  .opts{display:flex; flex-direction:column; gap:9px;}
  /* 짧은 선택지: 반응형 그리드 — 짧으면 4~5열, 길면 자동 축소 */
  .opts.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:10px;}
  .opt{display:flex; align-items:flex-start; gap:11px; padding:14px 17px; border:1.5px solid var(--line);
       border-radius:9px; cursor:pointer; transition:.12s; font-size:16.5px;}
  .opt:hover{border-color:var(--green-2); background:var(--sel-bg);}
  .opt.sel{border-color:var(--sel); background:var(--sel-bg);}
  .opt input{margin-top:3px; accent-color:var(--green); width:20px; height:20px; flex-shrink:0;}
  .opt .txt{flex:1;}
  .opt .etc-in{margin-top:8px; width:100%; border:1px solid var(--line); border-radius:6px; padding:7px 10px; font-size:13px; display:none;}
  .opt.sel .etc-in.show{display:block;}

  /* rank (1·2순위) */
  .rankopts{display:flex; flex-direction:column; gap:8px;}
  .rankopts.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(360px, 1fr)); gap:10px; align-items:stretch;}
  .rankopts.grid .rankopt{align-items:center;}
  .rankopt{display:flex; align-items:center; gap:13px; padding:11px 16px; border:1.5px solid var(--line);
           border-radius:9px; transition:.12s; font-size:15.5px;}
  .rankopt .txt{flex:1;}
  .rankopt .etc-in{margin-left:8px; border:1px solid var(--line); border-radius:6px; padding:6px 9px; font-size:13px; width:220px; display:none;}
  .rankopt .etc-in.show{display:inline-block;}
  .rk{width:34px;height:34px;border-radius:50%;border:2px solid #b6c4bd;background:#fff;cursor:pointer;
      display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#9aa8a2;transition:.12s;flex-shrink:0;}
  .rk:hover{border-color:var(--green-2);background:var(--sel-bg);}
  .rk.on1{background:var(--r1);border-color:var(--r1);color:#fff;}
  .rk.on2{background:var(--r2);border-color:var(--r2);color:#fff;}
  .rkwrap{display:inline-flex;gap:7px;}

  /* matrix */
  .mtx-scroll{overflow-x:auto;}
  table{border-collapse:collapse; width:100%; font-size:14.5px;}
  th,td{border:1px solid var(--line); padding:10px 8px; text-align:center;}
  thead th{background:var(--green-soft); color:var(--green); font-weight:700;}
  .col-legacy{text-align:center; min-width:110px; max-width:130px; background:var(--legacy-bg);
              color:var(--green); font-size:12px; font-weight:700; vertical-align:middle;}
  .col-task{text-align:left; font-weight:600; min-width:250px; background:#fbfdfc;}
  .scalegroup{border-left:2.5px solid var(--group-line)!important;}
  .group-top>td,.group-top>th{border-top:2.5px solid var(--group-line)!important;}
  .scalehint{font-size:11px; color:var(--muted); font-weight:400;}
  .cellopt{cursor:pointer; width:42px; padding:0;}
  .cellopt input{display:none;}
  .cellopt label{display:flex; align-items:center; justify-content:center; width:100%; height:36px; cursor:pointer;}
  .dot{width:19px; height:19px; border:2px solid #b6c4bd; border-radius:50%; transition:.12s; background:#fff;}
  .cellopt:hover .dot{border-color:var(--green-2); background:var(--sel-bg);}
  .cellopt input:checked + label .dot{background:var(--sel); border-color:var(--sel); box-shadow:inset 0 0 0 3px #fff;}
  .rankcell{width:120px;}
  .rankbtn{display:inline-flex; gap:6px; justify-content:center;}
  .rankbtn button{border:1.5px solid var(--line); background:#fff; border-radius:7px; width:50px; padding:6px 0;
                  cursor:pointer; font-size:13px; color:var(--muted); font-weight:600;}
  .rankbtn button.r1{background:var(--r1); color:#fff; border-color:var(--r1);}
  .rankbtn button.r2{background:var(--r2); color:#fff; border-color:var(--r2);}
  .chk{width:21px; height:21px; accent-color:var(--green); cursor:pointer;}
  .colhead .rank{display:block; font-size:11px; color:var(--muted); font-weight:400; margin-bottom:3px;}
  .colhead .grp{display:block; font-size:13px; font-weight:700;}

  .step-guide{font-size:13.5px; font-weight:600; padding:10px 15px; border-radius:8px; margin:10px 0;
              background:var(--sel-bg); color:var(--green); border:1px solid var(--green-soft);}
  .step-guide.wait{background:var(--amber);color:#7a5b00;border-color:var(--amber-b);}

  /* text */
  textarea{width:100%; border:1.5px solid var(--line); border-radius:8px; padding:11px 13px;
           font-family:inherit; font-size:13.5px; resize:vertical; min-height:70px;}
  textarea:focus{outline:none; border-color:var(--green-2);}

  /* 조건부 숨김 */
  .conditional-hidden{display:none;}

  /* 제출부 */
  .submitbar{background:#fff; border:1px solid var(--line); border-radius:12px; padding:24px 28px; margin:30px 0;}
  .submitbar h3{margin:0 0 10px; color:var(--green); font-size:16px;}
  .missing-list{font-size:13px; color:var(--warn); margin:10px 0; display:none;}
  .missing-list a{color:var(--warn); text-decoration:underline; cursor:pointer; margin-right:10px;}
  .btn{background:var(--green); color:#fff; border:none; border-radius:9px; padding:13px 34px;
       font-size:15px; font-weight:700; cursor:pointer; transition:.12s;}
  .btn:hover{background:var(--green-2);}
  .btn:disabled{background:#a9b8b1; cursor:not-allowed;}
  .loading{padding:60px; text-align:center; color:var(--muted);}
  .done{text-align:center; padding:70px 20px;}
  .done .big{font-size:44px;}
  .done h2{color:var(--green); margin:14px 0 8px;}
</style>
</head>
<body>
<div class="progressbar">
  <div class="inner">
    <span class="pct" id="pct">0%</span>
    <div class="bar"><span id="barfill"></span></div>
    <span class="savestate" id="savestate">—</span>
  </div>
</div>
<header>
  <div class="wrap">
    <h1 id="stitle">전문가조사</h1>
    <p>제3차 부산광역시 아동친화도시 기본계획 수립연구</p>
  </div>
</header>
<div class="wrap">
  <div id="app"><div class="loading">설문을 불러오는 중…</div></div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SUPABASE_URL='https://wjuhtqhjkgotioaikyzd.supabase.co';
const SUPABASE_KEY='sb_publishable__HifIlzfrOHbrIiEpFtd1Q_dY4Om0Ej';
const SURVEY_CODE='busan_cfc3_expert_2026';
const sb=createClient(SUPABASE_URL,SUPABASE_KEY);

const app=document.getElementById('app');
const els={pct:document.getElementById('pct'),bar:document.getElementById('barfill'),
           save:document.getElementById('savestate'),title:document.getElementById('stitle')};

// ============ 상태 ============
const A={};              // 응답 저장소. key 규칙은 아래 build*에서
let TOKEN=null;          // 재접속 토큰
let META={survey:null,sections:[],Q:{},O:{},R:{},SC:{}};
let requiredCodes=[];    // 필수 문항 code 목록
const condControllers={};// depends_on 처리용 콜백 등록

// ============ 로드 ============
async function load(){
  const {data:survey,error}=await sb.from('surveys').select('*').eq('code',SURVEY_CODE).single();
  if(error||!survey){app.innerHTML=`<div class="qcard" style="color:var(--warn)">설문을 찾을 수 없습니다. (관리자에게 문의)</div>`;return;}
  META.survey=survey; els.title.textContent=survey.title;
  const {data:secs}=await sb.from('sections').select('*').eq('survey_id',survey.id).order('ord');
  const secIds=secs.map(s=>s.id);
  const {data:qs}=await sb.from('questions').select('*').in('section_id',secIds).order('ord');
  const qIds=qs.map(q=>q.id);
  const [{data:opts},{data:rows},{data:scales}]=await Promise.all([
    sb.from('options').select('*').in('question_id',qIds).order('ord'),
    sb.from('matrix_rows').select('*').in('question_id',qIds).order('ord'),
    sb.from('scales').select('*').in('question_id',qIds).order('ord'),
  ]);
  const byQ=a=>{const m={};(a||[]).forEach(x=>(m[x.question_id]??=[]).push(x));return m;};
  META.sections=secs; META.O=byQ(opts); META.R=byQ(rows); META.SC=byQ(scales);
  qs.forEach(q=>{META.Q[q.code]=q; q.section=secs.find(s=>s.id===q.section_id);});
  META.qsBySec={}; qs.forEach(q=>(META.qsBySec[q.section_id]??=[]).push(q));
  // 섹션 ord → 문항 ord 순으로 정렬 (누락 문항 스크롤 순서 보장)
  Object.values(META.qsBySec).forEach(arr=>arr.sort((a,b)=>a.ord-b.ord));
  requiredCodes=[];
  secs.forEach(sec=>{(META.qsBySec[sec.id]||[]).forEach(q=>{if(q.required)requiredCodes.push(q.code);});});

  // 재접속 토큰 (URL ?t= 또는 localStorage)
  const urlTok=new URLSearchParams(location.search).get('t');
  TOKEN=urlTok||localStorage.getItem('cfc3_token_'+survey.id)||null;

  render(secs);
  if(TOKEN){ await restoreDraft(); }
  recalcProgress();
}

// ============ 렌더 전체 ============
function render(secs){
  app.innerHTML='';
  app.appendChild(node('div','intro',null,survey_intro()));
  app.appendChild(node('div','pcnote','','이 설문은 표 문항이 많아 <b>PC 화면</b>에서 응답하시길 권장합니다. 응답은 자동 저장되며, 같은 기기에서 이어서 작성할 수 있습니다.'));
  secs.forEach(sec=>{
    const secDiv=node('div','section');
    secDiv.innerHTML=`<h2>${sec.ord}. ${sec.title}</h2>`+(sec.intro?`<div class="sintro">${esc(sec.intro)}</div>`:'');
    app.appendChild(secDiv);
    (META.qsBySec[sec.id]||[]).forEach(q=>{
      const card=buildQuestion(q);
      app.appendChild(card);
    });
  });
  // 제출부
  const sb2=node('div','submitbar');
  sb2.innerHTML=`<h3>응답 제출</h3>
    <div class="hint">모든 필수 문항에 응답하면 제출할 수 있습니다. 제출 전까지 자동 저장됩니다.</div>
    <div class="missing-list" id="missinglist"></div>
    <button class="btn" id="submitbtn">설문 제출하기</button>`;
  app.appendChild(sb2);
  document.getElementById('submitbtn').onclick=submit;
  // 조건부 초기 상태 적용
  Object.values(condControllers).forEach(fn=>fn());
}
function survey_intro(){return esc(META.survey.intro||'');}

// ============ 문항 빌더 (타입 분기) ============
function buildQuestion(q){
  const card=node('div','qcard'); card.id='q_'+q.code; card._q=q;
  const req=q.required?'<span class="req">*</span>':'';
  card.innerHTML=`<div class="qcode">${qLabel(q)}</div><div class="qtitle">${esc(q.title)}${req}</div>`
    +(q.note?`<div class="qnote">${esc(q.note)}</div>`:'');
  const body=node('div','qbody'); card.appendChild(body);
  const R=META.R[q.id]||[], O=META.O[q.id]||[], SC=META.SC[q.id]||[];
  if(q.type==='single')            buildSingle(q,O,body);
  else if(q.type==='multi')        buildMulti(q,O,body);
  else if(q.type==='rank')         buildRank(q,O,body);
  else if(q.type==='text')         buildText(q,body);
  else if(q.type==='matrix_scale') buildMatrixScale(q,R,SC,body);
  else if(q.type==='matrix_check_group') buildCheckGroup(q,R,body);
  // 조건부 등록
  if(q.depends_on) registerConditional(q,card);
  return card;
}
function qLabel(q){ // Q12, S13-A1 등에서 사람이 읽는 번호
  const m=q.code.match(/^Q(\d+)/); if(m) return m[0]+'번';
  return q.code;
}

// ---- single ----
function isShortSet(O){ // 선택지가 짧으면(기타 제외 25자 이하, 기타는 짧게) 그리드 배치
  return O.every(o=>{
    const len=(o.label||'').length;
    return o.allow_text ? len<=8 : len<=25;
  });
}
function buildSingle(q,O,body){
  const wrap=node('div','opts'+(isShortSet(O)?' grid':''));
  O.forEach(o=>{
    const lab=node('label','opt');
    lab.innerHTML=`<input type="radio" name="${q.code}" value="${o.code}"><span class="txt">${esc(o.label)}</span>`;
    if(o.allow_text){const inp=node('input','etc-in');inp.placeholder='직접 입력';
      inp.oninput=()=>{A[`${q.code}.text`]=inp.value;scheduleSave();};lab.querySelector('.txt').appendChild(inp);}
    const radio=lab.querySelector('input');
    radio.onchange=()=>{wrap.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
      lab.classList.add('sel'); A[q.code]={opt:o.code}; onAnswer(q);
      const ei=lab.querySelector('.etc-in'); if(ei) ei.classList.toggle('show',o.allow_text);};
    wrap.appendChild(lab);
  });
  body.appendChild(wrap);
}
// ---- multi (min/max) ----
function buildMulti(q,O,body){
  const min=q.config?.min, max=q.config?.max;
  const hint=node('div','hint','', max?`${min===max?max+'개':min+'~'+max+'개'} 선택`:'복수 선택');
  body.appendChild(hint);
  const wrap=node('div','opts'+(isShortSet(O)?' grid':''));
  A[q.code]={opts:[]};
  O.forEach(o=>{
    const lab=node('label','opt');
    lab.innerHTML=`<input type="checkbox" value="${o.code}"><span class="txt">${esc(o.label)}</span>`;
    if(o.allow_text){const inp=node('input','etc-in');inp.placeholder='직접 입력';
      inp.oninput=()=>{A[`${q.code}.text`]=inp.value;scheduleSave();};lab.querySelector('.txt').appendChild(inp);}
    const cb=lab.querySelector('input');
    cb.onchange=()=>{
      const arr=A[q.code].opts;
      if(cb.checked){ if(max&&arr.length>=max){cb.checked=false;return;} arr.push(o.code); lab.classList.add('sel'); }
      else { A[q.code].opts=arr.filter(c=>c!==o.code); lab.classList.remove('sel'); }
      const ei=lab.querySelector('.etc-in'); if(ei) ei.classList.toggle('show',cb.checked&&o.allow_text);
      onAnswer(q);
    };
    wrap.appendChild(lab);
  });
  body.appendChild(wrap);
}
// ---- rank (1·2순위) ----
function buildRank(q,O,body){
  const ranks=q.config?.ranks||2;
  body.appendChild(node('div','hint','',`우선순위에 따라 ${ranks}개를 선택해 주십시오.`));
  const wrap=node('div','rankopts grid');
  const picks=[]; A[q.code]={rank:[]};
  const rows=[];
  O.forEach(o=>{
    const row=node('div','rankopt');
    const rkwrap=node('div','rkwrap');
    for(let r=1;r<=ranks;r++){const b=node('div','rk');b.textContent=r;b._rank=r;b._code=o.code;
      b.onclick=()=>toggle(o,r);rkwrap.appendChild(b);}
    row.appendChild(rkwrap);
    const txt=node('span','txt','',esc(o.label)); row.appendChild(txt);
    if(o.allow_text){const inp=node('input','etc-in');inp.placeholder='직접 입력';
      inp.oninput=()=>{A[`${q.code}.text`]=inp.value;scheduleSave();};row.appendChild(inp);}
    row._code=o.code; rows.push(row); wrap.appendChild(row);
  });
  function toggle(o,rank){
    const idx=rank-1, cur=picks[idx];
    const ex=picks.findIndex(p=>p&&p.code===o.code);
    if(ex>=0&&ex!==idx) picks.splice(ex,1);
    if(cur&&cur.code===o.code) picks.splice(idx,1);
    else { if(idx>0&&picks.length<idx) picks.push(o); else picks[idx]=o; }
    for(let i=picks.length-1;i>=0;i--) if(!picks[i]) picks.splice(i,1);
    if(picks.length>ranks) picks.length=ranks;
    A[q.code].rank=picks.map((p,i)=>({rank:i+1,code:p.code}));
    refresh(); onAnswer(q);
  }
  function refresh(){
    rows.forEach(row=>{
      const pos=picks.findIndex(p=>p&&p.code===row._code);
      [...row.querySelectorAll('.rk')].forEach(b=>{b.className='rk';
        if(pos>=0&&b._rank===pos+1) b.classList.add('on'+(pos+1));});
      const o=(META.O[q.id]||[]).find(x=>x.code===row._code);
      const ei=row.querySelector('.etc-in'); if(ei) ei.classList.toggle('show',pos>=0&&o?.allow_text);
    });
  }
  wrap._refresh=refresh; body.appendChild(wrap); body._rankToggle=toggle;
  // 재접속 복원용: 저장된 rank 배열([{rank,code}])로 picks 재구성 후 화면 반영
  wrap._restore=function(savedRank){
    picks.length=0;
    (savedRank||[]).slice().sort((a,b)=>a.rank-b.rank).forEach(rk=>{
      const o=(META.O[q.id]||[]).find(x=>x.code===rk.code);
      if(o) picks[rk.rank-1]=o;
    });
    for(let i=picks.length-1;i>=0;i--) if(!picks[i]) picks.splice(i,1);
    A[q.code].rank=picks.map((p,i)=>({rank:i+1,code:p.code}));
    refresh();
  };
}
// ---- text ----
function buildText(q,body){
  const ta=node('textarea'); ta.placeholder='자유롭게 작성해 주십시오.';
  ta.oninput=()=>{A[q.code]={text:ta.value}; onAnswer(q,false);};
  body.appendChild(ta);
}
// ---- matrix_scale ----
function buildMatrixScale(q,rows,scales,body){
  const hasLegacy=rows.some(r=>r.meta?.legacy_field);
  const pick=q.config?.priority_pick||0;
  const scroll=node('div','mtx-scroll'); const t=node('table');
  const h1=node('tr'); if(hasLegacy)h1.appendChild(th('4대 분야','col-legacy'));
  h1.appendChild(th('항목','col-task'));
  scales.forEach(s=>{const c=th(s.label,'scalegroup');c.colSpan=5;h1.appendChild(c);});
  if(pick) h1.appendChild(th('우선순위','scalegroup'));
  const h2=node('tr'); if(hasLegacy)h2.appendChild(th('','col-legacy')); h2.appendChild(th('','col-task'));
  scales.forEach(s=>{for(let v=1;v<=5;v++){const c=th(v,(v===1?'scalegroup ':'')+'scalehint');c.title=s.labels?.[v-1]||'';h2.appendChild(c);}});
  if(pick) h2.appendChild(th(`1·${pick}순위`,'scalegroup'));
  const thead=node('thead');thead.appendChild(h1);thead.appendChild(h2);t.appendChild(thead);
  // legacy 병합
  let runStart=0;const spanMap={};
  if(hasLegacy){for(let i=0;i<=rows.length;i++){const cur=i<rows.length?rows[i].meta?.legacy_field:'\u0000';
    if(i>0&&cur!==rows[runStart].meta?.legacy_field){spanMap[runStart]=i-runStart;runStart=i;}}}
  const tb=node('tbody');
  const rankState={};
  rows.forEach((r,i)=>{
    const tr=node('tr');
    if(hasLegacy&&spanMap[i]!==undefined&&i>0) tr.classList.add('group-top');
    if(hasLegacy&&spanMap[i]!==undefined){const lg=th? node('td','col-legacy'):null;lg.rowSpan=spanMap[i];lg.textContent=r.meta?.legacy_field||'';lg.className='col-legacy';tr.appendChild(lg);}
    const lab=node('td','col-task','',esc(r.label)); tr.appendChild(lab);
    scales.forEach(s=>{for(let v=1;v<=5;v++){const td=node('td','cellopt'+(v===1?' scalegroup':''));
      const id=`${q.code}_${r.code}_${s.code}_${v}`;
      td.innerHTML=`<input type="radio" name="${q.code}_${r.code}_${s.code}" id="${id}" value="${v}"><label for="${id}"><span class="dot"></span></label>`;
      td.querySelector('input').onchange=()=>{A[`${q.code}.m.${r.code}.${s.code}`]=v; onAnswer(q);};
      tr.appendChild(td);}});
    if(pick){const rc=node('td','rankcell');const g=node('div','rankbtn');g._code=r.code;
      g.innerHTML=`<button class="b1">1</button><button class="b2">2</button>`;
      g.querySelector('.b1').onclick=()=>rtoggle(r.code,1);
      g.querySelector('.b2').onclick=()=>rtoggle(r.code,2);
      rc.appendChild(g);tr.appendChild(rc);}
    tb.appendChild(tr);
  });
  function rtoggle(code,rank){for(const k in rankState)if(rankState[k]===rank&&k!==code)delete rankState[k];
    if(rankState[code]===rank)delete rankState[code];else rankState[code]=rank;
    A[`${q.code}.rank`]={...rankState};
    [...tb.querySelectorAll('.rankbtn')].forEach(g=>{g.querySelector('.b1').className='b1'+(rankState[g._code]===1?' r1':'');
      g.querySelector('.b2').className='b2'+(rankState[g._code]===2?' r2':'');});
    onAnswer(q);}
  t.appendChild(tb);scroll.appendChild(t);body.appendChild(scroll);
  // 진행 계산용: 이 문항의 총 셀 수
  META.Q[q.code]._cells=rows.length*scales.length;
}
// ---- matrix_check_group (Q29, Q28 연동) ----
function buildCheckGroup(q,rows,body){
  const dep=q.depends_on; const srcCode=dep.question; // Q28
  const guide=node('div','step-guide'); const box=node('div');
  body.appendChild(guide); body.appendChild(box);
  function draw(){
    const picks=(A[srcCode]?.rank)||[]; // [{rank,code}]
    if(picks.length===0){guide.className='step-guide wait';
      guide.textContent=`※ 먼저 ${srcCode.replace('Q','')}번에서 1·2순위 집단을 선택하면, 그 집단이 아래 표의 열로 나타납니다.`;
      box.innerHTML='';return;}
    guide.className='step-guide';
    guide.textContent=`${srcCode.replace('Q','')}번에서 고른 집단별로 우선 지원방식을 선택하세요. (해당되는 것을 자유롭게 선택)`;
    const cols=picks.map(p=>({code:p.code,label:(META.O[META.Q[srcCode].id]||[]).find(o=>o.code===p.code)?.label||p.code,rank:p.rank}));
    const t=node('table');const hr=node('tr');hr.appendChild(th('지원방식','col-task'));
    cols.forEach(c=>{const cell=node('th','colhead');cell.style.minWidth='190px';
      cell.innerHTML=`<span class="rank">${dep.question.replace('Q','')}번 ${c.rank}순위 집단</span><span class="grp">${esc(c.label)}</span>`;hr.appendChild(cell);});
    const thead=node('thead');thead.appendChild(hr);t.appendChild(thead);
    const tb=node('tbody');
    rows.forEach(r=>{const tr=node('tr');tr.appendChild(node('td','col-task','',esc(r.label)));
      cols.forEach(c=>{const td=node('td');const cb=node('input');cb.type='checkbox';cb.className='chk';
        cb.checked=!!A[`${q.code}.g.${r.code}.${c.code}`];
        cb.onchange=()=>{A[`${q.code}.g.${r.code}.${c.code}`]=cb.checked;onAnswer(q,false);};
        td.appendChild(cb);tr.appendChild(td);});
      tb.appendChild(tr);});
    t.appendChild(tb);box.innerHTML='';box.appendChild(t);
  }
  condControllers[q.code]=draw; // Q28 바뀔 때 호출됨
  draw();
}

// ============ 조건부 (depends_on) ============
function registerConditional(q,card){
  const dep=q.depends_on;
  if(dep.mode==='answered'){ // Q15: Q14에 응답이 있어야 표시
    const fn=()=>{const answered=!!A[dep.question]&&((A[dep.question].rank||[]).length>0||A[dep.question].opt);
      card.classList.toggle('conditional-hidden',!answered);};
    condControllers['show_'+q.code]=fn; fn();
  }
  // matrix_check_group(Q29)은 buildCheckGroup 내부 draw가 처리 (condControllers[q.code])
}

// ============ 응답 이벤트 ============
function onAnswer(q,immediate=true){
  const card=document.getElementById('q_'+q.code); if(card) card.classList.remove('missing');
  // 소스가 Q14/Q28인 경우 관련 조건부 문항 갱신
  if(q.code==='Q14' && condControllers['show_Q15']) condControllers['show_Q15']();
  if(q.code==='Q28' && condControllers['Q29']) condControllers['Q29']();
  recalcProgress();
  scheduleSave();
}

// ============ 진행률 ============
function recalcProgress(){
  const total=requiredCodes.length;
  let done=0;
  requiredCodes.forEach(code=>{ if(isAnswered(code)) done++; });
  const pct=total?Math.round(done/total*100):0;
  els.pct.textContent=pct+'%'; els.bar.style.width=pct+'%';
}
function isAnswered(code){
  // 조건부로 숨겨진 문항(예: Q14 미응답 시 Q15)은 필수 검증에서 제외
  const card=document.getElementById('q_'+code);
  if(card && card.classList.contains('conditional-hidden')) return true;
  const q=META.Q[code]; if(!q) return false; const v=A[code];
  if(q.type==='single') return !!(v&&v.opt);
  if(q.type==='multi'){const min=q.config?.min||1;return !!(v&&v.opts&&v.opts.length>=min);}
  if(q.type==='rank'){const rk=q.config?.ranks||2;return !!(v&&v.rank&&v.rank.length>=rk);}
  if(q.type==='text') return !!(v&&v.text&&v.text.trim());
  if(q.type==='matrix_scale'){
    const rows=META.R[q.id]||[],sc=META.SC[q.id]||[]; let n=0;
    rows.forEach(r=>sc.forEach(s=>{if(A[`${code}.m.${r.code}.${s.code}`])n++;}));
    return n>=rows.length*sc.length;
  }
  if(q.type==='matrix_check_group') return true; // 필수 아님 처리(자유선택)
  return false;
}

// ============ 저장 (자동, 디바운스) ============
let saveTimer=null, saving=false;
function scheduleSave(){
  els.save.textContent='입력 중…'; els.save.style.color='var(--muted)';
  clearTimeout(saveTimer); saveTimer=setTimeout(saveDraft,1200);
}
async function ensureToken(){
  if(TOKEN) return TOKEN;
  const {data,error}=await sb.rpc('start_response',{p_survey_code:SURVEY_CODE,p_meta:{ua:navigator.userAgent.slice(0,120)}});
  if(error){console.error(error);return null;}
  TOKEN=Array.isArray(data)?data[0]?.response_token:data?.response_token;
  if(TOKEN){localStorage.setItem('cfc3_token_'+META.survey.id,TOKEN);
    const u=new URL(location.href);u.searchParams.set('t',TOKEN);history.replaceState(null,'',u);}
  return TOKEN;
}
function buildPayload(){
  // A -> RPC payload 배열
  const P=[];
  for(const sec of META.sections){
    for(const q of (META.qsBySec[sec.id]||[])){
      const v=A[q.code]; const code=q.code;
      if(q.type==='single'&&v?.opt){P.push({q:code,opt:v.opt,text:A[code+'.text']||null});}
      else if(q.type==='multi'&&v?.opts){v.opts.forEach(oc=>P.push({q:code,opt:oc,text:A[code+'.text']||null}));}
      else if(q.type==='rank'&&v?.rank){v.rank.forEach(rk=>P.push({q:code,opt:rk.code,rank:rk.rank,text:A[code+'.text']||null}));}
      else if(q.type==='text'&&v?.text){P.push({q:code,text:v.text});}
      else if(q.type==='matrix_scale'){
        const rows=META.R[q.id]||[],sc=META.SC[q.id]||[];
        rows.forEach(r=>sc.forEach(s=>{const val=A[`${code}.m.${r.code}.${s.code}`];
          if(val)P.push({q:code,row:r.code,scale:s.code,num:val});}));
        const rk=A[`${code}.rank`]||{}; Object.entries(rk).forEach(([rc,rank])=>P.push({q:code,row:rc,rank}));
      }
      else if(q.type==='matrix_check_group'){
        const rows=META.R[q.id]||[];
        rows.forEach(r=>{Object.keys(A).filter(k=>k.startsWith(`${code}.g.${r.code}.`)&&A[k]).forEach(k=>{
          const oc=k.split('.').pop(); P.push({q:code,row:r.code,opt:oc,num:1});});});
      }
    }
  }
  return P;
}
async function saveDraft(){
  if(saving) return; saving=true;
  try{
    const tok=await ensureToken(); if(!tok){els.save.textContent='저장 대기';saving=false;return;}
    els.save.textContent='저장 중…';
    const payload=buildPayload();
    const {error}=await sb.rpc('save_draft',{p_token:tok,p_payload:payload,p_progress:{pct:els.pct.textContent}});
    if(error){els.save.textContent='저장 실패';els.save.style.color='var(--warn)';console.error(error);}
    else{const t=new Date();els.save.textContent='저장됨 '+t.getHours()+':'+String(t.getMinutes()).padStart(2,'0');
      els.save.style.color='var(--green)';}
  }catch(e){console.error(e);els.save.textContent='저장 실패';}
  saving=false;
}

// ============ 재접속 복원 ============
async function restoreDraft(){
  const {data,error}=await sb.rpc('load_draft',{p_token:TOKEN});
  if(error||!data){return;}
  if(data.status==='submitted'){showDone(true);return;}
  const ans=data.answers||[];
  // answers[] -> A 복원 (렌더 후 반영)
  ans.forEach(a=>{
    const q=META.Q[a.q]; if(!q) return;
    if(q.type==='single'){A[a.q]={opt:a.opt}; if(a.text)A[a.q+'.text']=a.text; applySingle(q,a.opt,a.text);}
    else if(q.type==='multi'){(A[a.q]??={opts:[]}); if(a.opt){A[a.q].opts.push(a.opt);} if(a.text)A[a.q+'.text']=a.text;}
    else if(q.type==='rank'){(A[a.q]??={rank:[]}); if(a.rank)A[a.q].rank.push({rank:a.rank,code:a.opt}); if(a.text)A[a.q+'.text']=a.text;}
    else if(q.type==='text'){A[a.q]={text:a.text};}
    else if(q.type==='matrix_scale'){ if(a.row&&a.scale){A[`${a.q}.m.${a.row}.${a.scale}`]=a.num;}
      else if(a.row&&a.rank){(A[`${a.q}.rank`]??={})[a.row]=a.rank;} }
    else if(q.type==='matrix_check_group'){ if(a.row&&a.opt) A[`${a.q}.g.${a.row}.${a.opt}`]=true; }
  });
  // rank 정렬
  Object.keys(A).forEach(k=>{const q=META.Q[k]; if(q&&q.type==='rank'&&A[k].rank)A[k].rank.sort((x,y)=>x.rank-y.rank);
    if(q&&q.type==='multi'&&A[k].opts)A[k].opts=[...new Set(A[k].opts)];});
  reflectAll();
}
// 복원값을 화면에 반영
function reflectAll(){
  for(const code in META.Q){
    const q=META.Q[code], v=A[code]; if(!v) continue;
    // single
    if(q.type==='single'&&v.opt){
      const r=document.querySelector(`input[name="${code}"][value="${v.opt}"]`);
      if(r){r.checked=true;r.dispatchEvent(new Event('change'));}
    }
    // multi
    if(q.type==='multi'&&v.opts){
      v.opts.forEach(oc=>{const c=document.querySelector(`#q_${code} input[value="${oc}"]`);
        if(c){c.checked=true;const opt=c.closest('.opt');opt?.classList.add('sel');
          const ei=opt?.querySelector('.etc-in');if(ei)ei.classList.add('show');}});
    }
    // rank — buildRank가 노출한 _restore 로 picks 재구성 + 화면 반영
    if(q.type==='rank'&&v.rank){
      const wrap=document.querySelector('#q_'+code+' .rankopts');
      if(wrap&&wrap._restore) wrap._restore(v.rank);
    }
    // matrix_scale — 척도 라디오 + 우선순위 버튼
    if(q.type==='matrix_scale'){
      const rows=META.R[q.id]||[],sc=META.SC[q.id]||[];
      rows.forEach(r=>sc.forEach(s=>{const val=A[`${code}.m.${r.code}.${s.code}`];
        if(val){const inp=document.getElementById(`${code}_${r.code}_${s.code}_${val}`);if(inp)inp.checked=true;}}));
      const rk=A[`${code}.rank`]||{};const tb=document.querySelector('#q_'+code+' tbody');
      if(tb)[...tb.querySelectorAll('.rankbtn')].forEach(g=>{
        g.querySelector('.b1').className='b1'+(rk[g._code]===1?' r1':'');
        g.querySelector('.b2').className='b2'+(rk[g._code]===2?' r2':'');});
    }
    // 기타(___) 직접입력 텍스트 복원 (single/multi/rank 공통)
    if(A[code+'.text']){
      const ei=document.querySelector(`#q_${code} .etc-in`);
      if(ei){ei.value=A[code+'.text'];ei.classList.add('show');
        // rank의 경우 부모 rankopt에도 표시 유지
        ei.closest('.opt')?.classList.add('sel');}
    }
  }
  // 조건부 재계산 (Q29 matrix_check_group 은 여기서 A값 기반으로 다시 그려짐)
  Object.values(condControllers).forEach(fn=>fn());
  recalcProgress();
}

// ============ 제출 ============
async function submit(){
  const missing=requiredCodes.filter(c=>!isAnswered(c));
  const ml=document.getElementById('missinglist');
  document.querySelectorAll('.qcard.missing').forEach(c=>c.classList.remove('missing'));
  if(missing.length){
    ml.style.display='block';
    ml.innerHTML='아직 응답하지 않은 필수 문항이 있습니다: '+
      missing.map(c=>`<a onclick="document.getElementById('q_${c}').scrollIntoView()">${qNum(c)}</a>`).join('');
    missing.forEach(c=>document.getElementById('q_'+c)?.classList.add('missing'));
    document.getElementById('q_'+missing[0])?.scrollIntoView();
    return;
  }
  const btn=document.getElementById('submitbtn'); btn.disabled=true; btn.textContent='제출 중…';
  await saveDraft();
  const {data,error}=await sb.rpc('submit_response',{p_token:TOKEN});
  if(error){btn.disabled=false;btn.textContent='설문 제출하기';alert('제출 오류: '+error.message);return;}
  if(data?.status==='incomplete'){btn.disabled=false;btn.textContent='설문 제출하기';
    ml.style.display='block';ml.textContent='일부 필수 문항이 누락되었습니다.';return;}
  localStorage.removeItem('cfc3_token_'+META.survey.id);
  showDone();
}
function qNum(c){return qLabel(META.Q[c]||{code:c});}
function showDone(already){
  app.innerHTML=`<div class="done"><div class="big">✓</div>
    <h2>${already?'이미 제출된 설문입니다':'설문이 제출되었습니다'}</h2>
    <p style="color:var(--muted)">소중한 응답에 감사드립니다. 창을 닫으셔도 됩니다.</p></div>`;
  els.pct.textContent='100%';els.bar.style.width='100%';els.save.textContent='제출 완료';
}

// ============ util ============
function node(tag,cls,html,text){const e=document.createElement(tag);if(cls)e.className=cls;
  if(html!=null&&html!=='')e.innerHTML=html; if(text!=null)e.innerHTML=text; return e;}
function th(txt,cls){const e=document.createElement('th');if(cls)e.className=cls;e.textContent=txt;return e;}
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
window.__A=A; // 디버그용

// ============ [개발용] 자동 채우기 (UI 테스트) ============
// 콘솔에서 autoFill() 실행 또는 URL 뒤에 #dev 붙이면 우측하단 버튼 표시
window.autoFill=function(){
  const pick=(arr,n)=>{const a=[...arr];const out=[];for(let i=0;i<n&&a.length;i++)out.push(a.splice(Math.floor(Math.random()*a.length),1)[0]);return out;};
  for(const sec of META.sections){
    for(const q of (META.qsBySec[sec.id]||[])){
      const card=document.getElementById('q_'+q.code);
      if(!card || card.classList.contains('conditional-hidden')) {}
      const O=META.O[q.id]||[], R=META.R[q.id]||[], SC=META.SC[q.id]||[];
      if(q.type==='single'){
        const o=O[Math.floor(Math.random()*O.length)];
        const r=card.querySelector(`input[value="${o.code}"]`); if(r){r.checked=true;r.dispatchEvent(new Event('change'));}
      } else if(q.type==='multi'){
        const need=q.config?.min||1; pick(O,need).forEach(o=>{const c=card.querySelector(`input[value="${o.code}"]`);if(c&&!c.checked){c.click();}});
      } else if(q.type==='rank'){
        const ranks=q.config?.ranks||2; const chosen=pick(O,ranks);
        chosen.forEach((o,i)=>{const btn=[...card.querySelectorAll('.rk')].find(b=>b._code===o.code&&b._rank===i+1);if(btn)btn.click();});
      } else if(q.type==='text'){
        const ta=card.querySelector('textarea'); if(ta && Math.random()<0.6){ta.value='[자동채움 테스트]';ta.dispatchEvent(new Event('input'));}
      } else if(q.type==='matrix_scale'){
        R.forEach(r=>SC.forEach(s=>{const v=1+Math.floor(Math.random()*5);
          const inp=document.getElementById(`${q.code}_${r.code}_${s.code}_${v}`);if(inp){inp.checked=true;inp.dispatchEvent(new Event('change'));}}));
        const pp=q.config?.priority_pick||0;
        if(pp){pick(R,pp).forEach((r,i)=>{const g=[...card.querySelectorAll('.rankbtn')].find(x=>x._code===r.code);
          if(g)g.querySelector(i===0?'.b1':'.b2').click();});}
      }
    }
  }
  // 조건부(Q29 등) 다시 채우기: Q28 반영 후 재실행 필요분
  setTimeout(()=>{
    const q29=META.sections.flatMap(s=>META.qsBySec[s.id]||[]).find(q=>q.type==='matrix_check_group');
    if(q29){const card=document.getElementById('q_'+q29.code);
      card.querySelectorAll('.chk').forEach(cb=>{if(Math.random()<0.4&&!cb.checked)cb.click();});}
  },300);
  console.log('autoFill 완료 — 진행률과 저장상태를 확인하세요.');
};
if(location.hash==='#dev'){
  const b=document.createElement('button');
  b.textContent='🔧 자동채우기';
  b.style.cssText='position:fixed;right:20px;bottom:20px;z-index:999;background:#333;color:#fff;border:none;border-radius:8px;padding:12px 18px;cursor:pointer;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.3)';
  b.onclick=()=>window.autoFill();
  setTimeout(()=>document.body.appendChild(b),1500);
}

load().catch(e=>{console.error(e);app.innerHTML=`<div class="qcard" style="color:var(--warn)">오류: ${e.message}</div>`;});
</script>
